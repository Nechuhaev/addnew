name: Deploy

# Деплой на хостинг ПІСЛЯ успішного CI на гілці production (тобто після мерджу PR).
# Потрібні секрети репозиторію (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (приватний ключ), DEPLOY_PATH (/home/addnew/addnew.biz/www),
#   DEPLOY_PORT (необов'язково, за замовчуванням 22).
# Без секретів деплой пропускається (CI при цьому працює).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Перевірка секретів
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::warning::Секрети DEPLOY_* не задані — деплой пропущено"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Деплой по SSH
        if: steps.check.outputs.skip != '1'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$USER@$HOST" "APP_PATH='$APP_PATH' bash -s" <<'REMOTE'
          set -e
          cd "$APP_PATH"
          before=$(git rev-parse HEAD)
          git pull --ff-only origin production
          after=$(git rev-parse HEAD)
          echo "Оновлено: $before -> $after"
          if git diff --name-only "$before" "$after" | grep -q '^composer.lock$'; then
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          fi
          php artisan migrate --force
          php artisan view:clear
          php artisan config:clear
          echo "Деплой завершено"
          REMOTE
